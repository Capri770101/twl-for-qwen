# ============================================================
# Alembic Configuration
#
# NOTE: This file must stay ASCII-only.
# Python's configparser reads it with the system locale encoding,
# and on Windows that is GBK, so Chinese characters here would crash
# with UnicodeDecodeError. Chinese explanations live in alembic/env.py
# and in the project docs instead.
#
# Common commands:
#   alembic revision --autogenerate -m "description"   # generate migration
#   alembic upgrade head                              # apply all migrations
#   alembic downgrade -1                              # roll back one
#   alembic current                                   # show current revision
#   alembic history                                   # show all revisions
# ============================================================

[alembic]
# Where migration scripts live
script_location = alembic

# Migration filename template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = Asia/Shanghai

# Database URL.
# NOTE: This is a placeholder. alembic/env.py overrides it at runtime
# with the value from app.core.config.settings.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Auto-format generated migration files with ruff.
# Disabled by default: ruff is an optional dev dependency and CI does not
# guarantee it is on PATH. Enable it locally if you want formatted output.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
