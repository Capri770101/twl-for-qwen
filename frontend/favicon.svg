<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>跳舞兰</title>
  <rect width="32" height="32" fill="#ffffff"/>
  <g fill="#141414">
    <!-- 上方花瓣 -->
    <circle cx="16" cy="12.5" r="4.1"/>
    <!-- 下方唇瓣：跳舞兰标志性的大裙摆 -->
    <path d="M16 16.6 C10.4 16.6 7.2 20.2 7.2 23.4 C7.2 26.4 11 27.6 16 25.6 C21 27.6 24.8 26.4 24.8 23.4 C24.8 20.2 21.6 16.6 16 16.6 Z"/>
  </g>
  <!-- 两侧细长侧瓣 -->
  <g fill="none" stroke="#141414" stroke-width="1.7" stroke-linecap="round">
    <path d="M12.2 11.8 C8.4 8.6 5.2 8.4 4.2 10.4 C3.3 12.4 6.2 14.6 10 13.6"/>
    <path d="M19.8 11.8 C23.6 8.6 26.8 8.4 27.8 10.4 C28.7 12.4 25.8 14.6 22 13.6"/>
  </g>
  <!-- 花蕊一点留白，呼应「跳舞」的轻盈 -->
  <circle cx="16" cy="21.6" r="1.5" fill="#ffffff"/>
</svg>
