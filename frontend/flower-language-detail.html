<script>
(function(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug') || 'champagne-rose';
  const app = document.getElementById('app');

  /* 简易 Markdown 渲染 */
  function md(text) {
    if (!text) return '';
    let h = text
      .replace(/^# (.+)$/gm, '<h2>$1</h2>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^### (.+)$/gm, '<h3 style="font-size:19px;font-weight:400;margin:36px 0 14px">$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/\n\n/g, '</p><p>');
    h = '<p>' + h + '</p>';
    return h;
  }

  function render(a) {
    const faqHtml = (a.faq || []).map(f => `
      <div class="faq-item">
        <div class="q"><span class="mark">Q</span>${f.question}</div>
        <div class="a">${f.answer}</div>
      </div>
    `).join('');

    // 目录：从正文里提取 h2
    const headings = [];
    const re = /^## (.+)$/gm;
    let m;
    while ((m = re.exec(a.content || '')) !== null) {
      headings.push(m[1]);
    }

    app.innerHTML = `
      <article class="art-left">
        <div class="crumb">
          <a href="index.html">首页</a> / <a href="flower-language.html">花语百科</a> / ${a.title}
        </div>

        <h1>${a.title}</h1>
        <div class="en">${a.category || ''}</div>

        ${a.cover ? `<div class="hero-img"><img src="${a.cover}" alt="${a.title}"></div>` : ''}

        ${a.meaning ? `<div class="meaning-box"><div class="lbl">花语</div><p>${a.meaning}</p></div>` : ''}

        <div class="article-body">${md(a.content)}</div>

        ${faqHtml ? `<div class="faq"><h2>常见问题</h2>${faqHtml}</div>` : ''}
      </article>

      <aside class="art-right">
        ${headings.length ? `
        <div class="toc">
          <div class="lbl">目录</div>
          ${headings.map((h, i) => `<a href="#sec-${i}">${h}</a>`).join('')}
        </div>` : ''}

        <div class="rel-box">
          <div class="lbl">相关花束</div>
          <a href="shop.html" class="rel-item" style="display:block;padding:12px 0;font-size:13px;color:#666">
            看看全部花束 →
          </a>
        </div>
      </aside>
    `;
  }

  (async () => {
    try {
      const a = await API.request('/articles/' + encodeURIComponent(slug));
      render(a);
    } catch (e) {
      app.innerHTML = `
        <div style="padding:120px 40px;text-align:center;color:#999">
          <p style="font-size:16px;margin-bottom:16px">文章加载失败</p>
          <p style="font-size:13px;margin-bottom:24px">${e.message}</p>
          <a href="flower-language.html" style="display:inline-block;padding:12px 32px;border:1px solid #1a1a1a;border-radius:4px;color:#1a1a1a;font-size:14px">返回花语百科</a>
        </div>
      `;
    }
  })();
})();
</script>

/* ═══════════════════════════════════════════════
   购物袋（全站共用）
   ═══════════════════════════════════════════════ */
(function(){
  const FREE = 199;

  window.TWL = {
    getCart() {
      try { return JSON.parse(localStorage.getItem('twl_cart') || '[]'); }
      catch { return []; }
    },
    setCart(items) {
      localStorage.setItem('twl_cart', JSON.stringify(items));
      this.updateBadge();
    },
    addToCart(item) {
      const items = this.getCart();
      const exist = items.find(i => i.id === item.id);
      if (exist) exist.qty += item.qty || 1;
      else items.push({ ...item, qty: item.qty || 1 });
      this.setCart(items);
      this.toast('已加入购物袋');
    },
    count() {
      return this.getCart().reduce((s, i) => s + i.qty, 0);
    },
    subtotal() {
      return this.getCart().reduce((s, i) => s + i.price * i.qty, 0);
    },
    updateBadge() {
      const n = this.count();
      document.querySelectorAll('.bag-count').forEach(el => {
        el.textContent = n;
        el.style.display = n > 0 ? 'inline' : 'none';
      });
    },
    toast(msg, ms) {
      let el = document.getElementById('__toast');
      if (!el) {
        el = document.createElement('div');
        el.id = '__toast';
        el.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(26,26,26,.92);color:#fff;padding:12px 24px;font-size:14px;border-radius:4px;z-index:99999;opacity:0;transition:opacity .25s;white-space:nowrap;';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.style.opacity = '1';
      clearTimeout(el.__t);
      el.__t = setTimeout(() => { el.style.opacity = '0'; }, ms || 2000);
    }
  };

  /* 初始化默认购物袋 */
  if (!localStorage.getItem('twl_cart_init')) {
    localStorage.setItem('twl_cart', JSON.stringify([
      { id: 'TW-001', name: '晨光序曲', spec: '香槟玫瑰 20 枝 · 满天星', price: 299, qty: 1, img: '' },
      { id: 'TW-004', name: '木星', spec: '向日葵 6 枝 · 尤加利叶', price: 219, qty: 1, img: '' }
    ]));
    localStorage.setItem('twl_cart_init', '1');
  }

  /* 页面加载后更新角标 */
  document.addEventListener('DOMContentLoaded', () => TWL.updateBadge());
  if (document.readyState !== 'loading') TWL.updateBadge();
})();
</script>
